name: Bucket

permissions: {}

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  bucket:
    uses: taiki-e/github-actions/.github/workflows/gen.yml@07c8b42e7ad077d40127201ac62770c6eb31893e # 2026.11.1
    permissions:
      contents: write # for creating branch for pr
      pull-requests: read # for gh pr list
    secrets:
      PR_TOKEN_APP_PRIVATE_KEY: ${{ secrets.PR_TOKEN_APP_PRIVATE_KEY }}
    with:
      script: tools/bucket.sh
      commit-script: tools/ci/bucket.sh
      title: Update bucket
      branch: update-bucket
